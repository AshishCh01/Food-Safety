# Render Blueprint (Infrastructure as Code) for the Maharashtra Food Safety
# Complaint & Inspection Platform demo deployment.
#
# See docs/DEPLOYMENT.md for the full setup walkthrough, the complete
# environment variable reference, and the production smoke-test checklist.
#
# Deploying this blueprint (Render dashboard -> New -> Blueprint, pointed at
# this repository) creates two Render Free Tier services:
#   - food-safety-backend  (Web Service, native Python runtime, no Docker)
#   - food-safety-frontend (Static Site, Vite production build)
#
# Neither Supabase (PostgreSQL/Storage/PostGIS/pgvector) nor the Gemini API
# are Render resources, so they are not declared here - both are configured
# purely through environment variables (see envVars below, most of which use
# `sync: false` and must be filled in once from the Render dashboard after
# the first blueprint deploy).
#
# This deployment intentionally has no Docker, Redis, Celery, or Kubernetes
# dependency - see docs/DEVELOPMENT_ROADMAP.md Phase 13 and
# docs/SYSTEM_ARCHITECTURE.md section 14 for the constraints this follows.

services:
  - type: web
    name: food-safety-backend
    runtime: python
    plan: free
    # Render regions: oregon, ohio, virginia, frankfurt, singapore. Pick
    # whichever is geographically closest to the Supabase project's own
    # region to minimize database round-trip latency; singapore is the
    # reasonable default for a Maharashtra-focused deployment.
    region: singapore
    rootDir: Backend
    buildCommand: pip install -r requirements.txt
    # Alembic runs on every start rather than as a Render "pre-deploy
    # command" because pre-deploy commands require a paid plan
    # (docs/DEPLOYMENT.md "Database migrations"). `alembic upgrade head` is
    # a no-op when the database is already at head, so re-running it on
    # every boot/restart is safe.
    #
    # --proxy-headers --forwarded-allow-ips='*' makes uvicorn trust the
    # X-Forwarded-For header Render's edge proxy sets, so request.client.host
    # (used by app/core/rate_limit.py's per-IP limiter) reflects the real
    # visiting client rather than Render's internal proxy address for every
    # request. '*' is safe specifically because Render's network only allows
    # the platform's own proxy to reach this service on $PORT - there is no
    # direct public ingress path that could spoof the header.
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips='*'
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: APP_NAME
        value: Food Safety Platform API
      - key: ENVIRONMENT
        value: production
      - key: LOG_LEVEL
        value: INFO
      # Supabase PostgreSQL connection string - set from the Render
      # dashboard (Supabase project settings -> Database -> Connection
      # string, "Transaction" pooler recommended for a single small
      # instance). Never committed to source control.
      - key: DATABASE_URL
        sync: false
      # Comma-separated list of allowed browser origins. Set to the deployed
      # frontend's exact Render Static Site URL (and any custom domain);
      # never "*" alongside allow_credentials=True.
      - key: CORS_ORIGINS
        sync: false
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "30"
      - key: REFRESH_TOKEN_EXPIRE_DAYS
        value: "7"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        value: complaint-evidence
      - key: RAG_STORAGE_BUCKET
        value: rag-documents
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MAIN_MODEL
        value: gemini-3.7-flash
      - key: GEMINI_REASONING_MODEL
        value: gemini-3.1-pro
      - key: GEMINI_EMBEDDING_MODEL
        value: gemini-embedding-2-preview
      - key: GEMINI_REQUEST_TIMEOUT_SECONDS
        value: "20"
      - key: ENABLE_REVERSE_GEOCODING
        value: "true"
      - key: NOMINATIM_BASE_URL
        value: https://nominatim.openstreetmap.org
      - key: NOMINATIM_USER_AGENT
        value: "food-safety-platform/1.0 (contact: ops@foodsafety.local)"

  - type: web
    runtime: static
    name: food-safety-frontend
    rootDir: Frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    # Client-side routing (React Router) - without this rewrite, refreshing
    # or deep-linking into any non-root route (e.g. /citizen/complaints)
    # would 404 at the static file server instead of reaching the SPA.
    routes:
      - type: rewrite
        path: /*
        destination: /index.html
    headers:
      - path: /*
        headers:
          - name: X-Content-Type-Options
            value: nosniff
          - name: X-Frame-Options
            value: DENY
          - name: Referrer-Policy
            value: strict-origin-when-cross-origin
    envVars:
      # Public backend base URL, baked into the static build at build time
      # (Vite only exposes VITE_-prefixed vars, and only as of the build
      # that ran with them set) - update and trigger a rebuild if the
      # backend's URL ever changes. Set to the food-safety-backend service's
      # onrender.com URL (or a custom domain) once it exists.
      - key: VITE_API_URL
        sync: false
